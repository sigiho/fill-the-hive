<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#F5FF00">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>FILL THE HIVE · HIVE OS</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js" defer></script>
<style>
/* ── 3색 규칙: 노랑 · 검정 · 흰색만. 음영은 투명도 대신 디더(체커) 패턴으로. ── */
:root{
  --y:#F5FF00; --k:#000; --w:#FFF;
  --f:"Galmuri11","Galmuri9",monospace;
  --f9:"Galmuri9","Galmuri11",monospace;
  --f14:"Galmuri14","Galmuri11",monospace;
  --checker:repeating-conic-gradient(var(--k) 0 25%, var(--y) 0 50%) 0 0/4px 4px;
  --checkw:repeating-conic-gradient(var(--k) 0 25%, var(--w) 0 50%) 0 0/4px 4px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--y);overflow:hidden}
body{font-family:var(--f);font-size:12px;line-height:1.5;color:var(--k);
  -webkit-font-smoothing:none;-moz-osx-font-smoothing:grayscale;
  user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;
  word-break:keep-all;overflow-wrap:anywhere}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
input{font:inherit;color:var(--k);background:var(--w);border:0;outline:0;border-radius:0;-webkit-user-select:text;user-select:text}
canvas,img{image-rendering:pixelated;image-rendering:crisp-edges}
svg{shape-rendering:crispEdges}
.ic{display:block;fill:currentColor}

#bg{position:fixed;inset:0;width:100%;height:100%}
#stage{position:fixed;inset:0;display:grid;place-items:center}
#credit{position:fixed;left:16px;bottom:12px;font-family:var(--f9);font-size:10px;background:var(--k);color:var(--y);padding:4px 8px;z-index:1}
@media (max-width:520px),(max-height:700px){#credit{display:none}}

/* ── 기기 ── */
#device{position:relative;width:min(100vw,410px);height:min(100dvh,860px);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (max-width:520px){#device{width:100vw;height:100dvh}}
#shell{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.top{position:relative;z-index:1;height:36px;display:flex;align-items:center;justify-content:space-between;padding:0 26px}
.top .slit{width:64px;height:8px;background:var(--k);box-shadow:inset 0 0 0 2px var(--k)}
.top .slit::after{content:"";display:block;margin:2px 4px;height:4px;background:var(--w)}
.top .model{font-family:var(--f9);font-size:10px;letter-spacing:.08em}
#bezel{position:relative;z-index:1;flex:1;min-height:0;margin:0 18px;display:flex;flex-direction:column;padding:14px 14px 0}
#lcd{position:relative;flex:1;min-height:0;background:var(--y);overflow:hidden;display:flex;flex-direction:column}
.mark{height:40px;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--y);font-family:var(--f9);font-size:10px;letter-spacing:.2em}
#controls{position:relative;z-index:1;height:clamp(180px,28dvh,246px)}
.cin{position:absolute;left:50%;top:0;width:410px;height:246px;transform-origin:50% 0;transform:translateX(-50%) scale(var(--cs,1))}

/* 방향키 */
.dpad{position:absolute;left:22px;top:18px;width:150px;height:150px}
.dpad svg{position:absolute;inset:0}
.dpad button{position:absolute;width:46px;height:46px}
.dpad .u{left:52px;top:8px}.dpad .d{left:52px;bottom:8px}.dpad .l{left:8px;top:52px}.dpad .r{right:8px;top:52px}
.dpad .on{fill:var(--y)}
.lbl{position:absolute;font-family:var(--f);font-size:12px}
.lbl.dir{left:70px;top:172px}
.ab{position:absolute;right:20px;top:26px;width:170px;height:120px}
.ab svg{position:absolute;inset:0}
.ab button{position:absolute;width:56px;height:56px;border-radius:50%}
.ab .a{left:22px;top:44px}.ab .b{left:94px;top:8px}
.ab .tag{position:absolute;font-size:13px;transform:rotate(-24deg)}
.ab .ta{left:30px;top:118px}.ab .tb{left:112px;top:84px}
.pills{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:14px}
.pill{width:58px;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:var(--f9);font-size:10px;letter-spacing:.06em}
.pill i{display:block;width:44px;height:12px;background:var(--k);transform:rotate(-20deg)}
.pill.on i{background:var(--y);box-shadow:0 0 0 2px var(--k)}
.grille{position:absolute;right:46px;bottom:40px;width:74px;height:60px}
.sig{position:absolute;right:28px;bottom:8px;font-family:var(--f9);font-size:10px}

/* ── LCD 공통 ── */
#status{height:22px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 10px;font-family:var(--f9);font-size:10px;position:relative}
#status .isl{position:absolute;left:50%;top:4px;transform:translateX(-50%);width:66px;height:14px;background:var(--k);
  box-shadow:0 0 0 0 var(--k);clip-path:polygon(4px 0,calc(100% - 4px) 0,100% 4px,100% calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,0 calc(100% - 4px),0 4px)}
#status .isl::after{content:"";position:absolute;right:10px;top:5px;width:4px;height:4px;background:var(--y)}
#status .isl.rec::after{animation:blink 1s steps(1) infinite}
#status .r{display:flex;gap:6px;align-items:center}
#screens{flex:1;min-height:0;position:relative}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;animation:wipe .16s steps(5)}
@keyframes wipe{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0)}}
.nav{flex:none;height:30px;display:flex;align-items:center;gap:6px;padding:0 6px;border-bottom:2px solid var(--k)}
.nav b{font-family:var(--f14);font-size:15px;font-weight:400;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav .nb{width:26px;height:22px;display:grid;place-items:center}
.nav .rt{font-family:var(--f9);font-size:10px;padding:2px 6px}
.body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:10px;scrollbar-width:thin;scrollbar-color:var(--k) var(--y);overscroll-behavior:contain}
.body::-webkit-scrollbar{width:6px}.body::-webkit-scrollbar-thumb{background:var(--k)}
#homebar{flex:none;height:12px;display:grid;place-items:center;cursor:pointer}
#homebar i{display:block;width:90px;height:4px;background:var(--k)}

/* 픽셀 박스 (모서리 1칸 깎기) */
.pb{background:var(--w);box-shadow:0 -2px var(--k),0 2px var(--k),-2px 0 var(--k),2px 0 var(--k);margin:2px}
.pk{background:var(--k);color:var(--y);box-shadow:0 -2px var(--k),0 2px var(--k),-2px 0 var(--k),2px 0 var(--k);margin:2px}
.dash{border:2px dashed var(--k)}
.dot{border:2px dotted var(--k)}
small,.sm{font-family:var(--f9);font-size:10px}
h1,h2,h3{font-weight:400}
.t14{font-family:var(--f14);font-size:15px;line-height:1.35}
.big{font-family:var(--f14);font-size:22px;line-height:1.2}
.inv{background:var(--k);color:var(--y)}
.row{display:flex;gap:8px;align-items:center}
.col{display:flex;flex-direction:column;gap:8px}
.sp{flex:1}
.mt{margin-top:10px}.mt2{margin-top:16px}
.center{text-align:center}
.pre{white-space:pre-wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:5px 10px;background:var(--w);
  box-shadow:0 -2px var(--k),0 2px var(--k),-2px 0 var(--k),2px 0 var(--k);margin:2px;min-height:26px}
.btn.k{background:var(--k);color:var(--y)}
.btn.full{display:flex;width:calc(100% - 4px)}
[data-f]{outline:none}
[data-f]:focus-visible,[data-f].kf{outline:none}
.btn:focus,.btn.kf{background:var(--k);color:var(--y)}
.btn:focus{outline:2px dotted var(--k);outline-offset:3px}
.btn.k:focus{background:var(--y);color:var(--k)}
.lnk{text-decoration:underline;text-underline-offset:3px;padding:0 2px}
.lnk:focus{background:var(--k);color:var(--y);text-decoration:none}
.li{display:flex;width:100%;align-items:center;gap:8px;padding:8px 6px;border-bottom:2px dotted var(--k);text-align:left}
.li:focus{background:var(--k);color:var(--y)}
.li .sub{font-family:var(--f9);font-size:10px;display:block}
.cur::before{content:"▶ ";animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.blink{animation:blink 1s steps(1) infinite}
.shake{animation:shake .3s steps(6)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* 부팅 */
.boot{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;height:100%;text-align:center;padding:16px}
.boot .logo{display:grid;grid-template-columns:repeat(3,auto);gap:2px}
.bar{width:150px;height:12px;box-shadow:0 0 0 2px var(--k);display:flex;gap:2px;padding:2px}
.bar i{display:block;width:10px;height:8px;background:var(--k)}
.typed{min-height:7.5em;text-align:left;white-space:pre-wrap}

/* 세계 선택 */
.wgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 6px;padding-bottom:28px}
.wgrid .wc:nth-child(3n+2){transform:translateY(28px)}
.wc{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px 4px;text-align:center}
.wc .hex{width:64px;height:58px;display:grid;place-items:center;position:relative}
.wc .hex svg.hx{position:absolute;inset:0}
.wc .hex .ic{position:relative}
.wc .nm{font-size:11px;line-height:1.25}
.wc .pl{font-family:var(--f9);font-size:10px;line-height:1.2}
.wc:focus .nm,.wc:focus .pl{background:var(--k);color:var(--y)}
.wc.lock{opacity:1}
.wc .hx .o{fill:var(--k)} .wc .hx .i{fill:var(--y)}
.wc.done .hx .i{fill:var(--k)} .wc.done .ic{color:var(--y)}
.wc.lock .hx .i{fill:var(--w)}
.wc:focus .hx .o{fill:var(--k)} .wc:focus .hx .i{fill:var(--w)}
.wc.done:focus .hx .i{fill:var(--k)}

/* 홈 */
.home .body{display:flex;flex-direction:column;gap:12px;background:
  radial-gradient(var(--k) 1px,transparent 1.2px) 0 0/12px 12px,var(--y)}
.widget{display:flex;gap:10px;align-items:center;padding:8px 10px;text-align:left}
.widget:focus{background:var(--k);color:var(--y)}
.slots{display:flex;gap:4px;margin-top:3px}
.slot{width:18px;height:18px;display:grid;place-items:center;box-shadow:0 0 0 2px currentColor;font-size:11px}
.slot.f{background:currentColor}
.slot.f span{color:var(--y)}
.widget:focus .slot.f span{color:var(--k)}
.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 4px}
.app{display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
.app .ai{width:46px;height:46px;display:grid;place-items:center;background:var(--k);color:var(--y);
  clip-path:polygon(6px 0,calc(100% - 6px) 0,calc(100% - 6px) 2px,calc(100% - 2px) 2px,calc(100% - 2px) 6px,100% 6px,100% calc(100% - 6px),calc(100% - 2px) calc(100% - 6px),calc(100% - 2px) calc(100% - 2px),calc(100% - 6px) calc(100% - 2px),calc(100% - 6px) 100%,6px 100%,6px calc(100% - 2px),2px calc(100% - 2px),2px calc(100% - 6px),0 calc(100% - 6px),0 6px,2px 6px,2px 2px,6px 2px)}
.app .an{font-size:11px;line-height:1.2;padding:0 3px;background:var(--y)}
.app:focus .ai{background:var(--w);color:var(--k);outline:none;box-shadow:none}
.app:focus .ai{clip-path:none;box-shadow:inset 0 0 0 3px var(--k)}
.app:focus .an{background:var(--k);color:var(--y)}
.badge{position:absolute;top:-4px;right:6px;min-width:16px;height:16px;padding:0 3px;background:var(--w);color:var(--k);font-family:var(--f9);font-size:10px;line-height:16px;text-align:center;box-shadow:0 0 0 2px var(--k)}
.dock{flex:none;display:grid;grid-template-columns:repeat(4,1fr);padding:8px 8px 6px;background:var(--w);border-top:2px solid var(--k)}
.dock .an{background:transparent}
.dock .app:focus .an{background:var(--k)}

/* 메시지 */
.chat{display:flex;flex-direction:column;gap:6px}
.bub{max-width:82%;padding:6px 8px;white-space:pre-wrap}
.bub.n{align-self:flex-start;background:var(--w);box-shadow:0 -2px var(--k),0 2px var(--k),-2px 0 var(--k),2px 0 var(--k);margin:2px}
.bub.b{align-self:flex-end;background:var(--k);color:var(--y);margin:2px}
.bub.q{align-self:flex-start;background:var(--y);box-shadow:0 0 0 2px var(--k);margin:2px}
.who{font-family:var(--f9);font-size:10px;margin-top:4px}
.who.r{align-self:flex-end}
.sys{align-self:center;font-family:var(--f9);font-size:10px;background:var(--k);color:var(--y);padding:1px 8px}
.av{width:32px;height:32px;flex:none;display:grid;place-items:center;background:var(--k);color:var(--y)}
.li:focus .av{background:var(--y);color:var(--k)}
.unr{width:8px;height:8px;background:var(--k);flex:none}
.li:focus .unr{background:var(--y)}

/* 메모 / 앨범 */
.paper{padding:10px 12px;white-space:pre-wrap;background:var(--w);box-shadow:0 -2px var(--k),0 2px var(--k),-2px 0 var(--k),2px 0 var(--k);margin:2px;
  background-image:linear-gradient(var(--w) 16px,var(--k) 16px,var(--k) 17px,transparent 17px);background-size:100% 18px;line-height:18px;background-position:0 8px}
.mirror{transform:scaleX(-1)}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.th{display:block;aspect-ratio:4/3;position:relative;box-shadow:0 0 0 2px var(--k);background:var(--k);overflow:hidden}
.th canvas,.th img{width:100%;height:100%;display:block;object-fit:cover}
.th:focus{box-shadow:0 0 0 2px var(--k),0 0 0 5px var(--w),0 0 0 7px var(--k)}
.th .tg{position:absolute;left:0;bottom:0;background:var(--k);color:var(--y);font-family:var(--f9);font-size:10px;padding:0 3px}
.ph{width:100%;aspect-ratio:4/3;display:block;box-shadow:0 0 0 2px var(--k);background:var(--k)}
.ph.tall{aspect-ratio:3/4;object-fit:contain}
.back{aspect-ratio:4/3;display:grid;place-items:center;text-align:center;white-space:pre-wrap;background:var(--w);box-shadow:0 0 0 2px var(--k);padding:10px;font-family:var(--f14);font-size:15px}
.secth{font-family:var(--f9);font-size:10px;letter-spacing:.1em;margin:12px 0 6px;display:flex;align-items:center;gap:6px}
.secth::after{content:"";flex:1;height:2px;background:var(--checker)}

/* 브라우저 */
.addr{flex:none;display:flex;gap:4px;padding:6px;border-bottom:2px solid var(--k);background:var(--w)}
.addr input{flex:1;min-width:0;padding:3px 6px;box-shadow:0 0 0 2px var(--k);font-size:12px}
.addr input:focus{box-shadow:0 0 0 2px var(--k),inset 0 0 0 1px var(--k)}
.web h2{font-family:var(--f14);font-size:17px;line-height:1.3}
.web .hero{padding:12px;margin:-10px -10px 10px;background:var(--k);color:var(--y)}
.web table{width:100%;border-collapse:collapse;margin-top:6px}
.web td{border-bottom:2px dotted var(--k);padding:4px 2px;vertical-align:top}
.web .post{padding:6px 0;border-bottom:2px dotted var(--k)}
.web .k404{font-family:var(--f14);font-size:40px;line-height:1}
.seq{display:block;width:100%;padding:10px;text-align:center;font-family:var(--f14);font-size:18px;letter-spacing:.1em;background:var(--w);box-shadow:0 0 0 2px var(--k)}
.seq:focus{background:var(--k);color:var(--y)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:8px}
.keys .btn{min-height:32px;font-size:14px}
.kpd{font-family:var(--f14);font-size:24px;text-align:center;letter-spacing:.3em;padding:8px;background:var(--w);box-shadow:0 0 0 2px var(--k)}

/* 카메라 */
.cam .body{display:flex;flex-direction:column;gap:6px;padding:6px}
.vf{position:relative;flex:1;min-height:120px;background:var(--k);box-shadow:0 0 0 2px var(--k)}
.vf canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.vf .msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--y);padding:16px;white-space:pre-wrap}
.vf .mi{position:absolute;left:0;right:0;top:0;background:var(--k);color:var(--y);padding:4px 6px;font-size:11px;line-height:1.35}
.vf .ret{position:absolute;inset:22% 22%;box-shadow:0 0 0 2px var(--y);pointer-events:none}
.vf .ret::before,.vf .ret::after{content:"";position:absolute;width:10px;height:10px;background:var(--y)}
.vf .ret::before{left:-6px;top:-6px}.vf .ret::after{right:-6px;bottom:-6px}
.tabs{display:flex;gap:4px;flex:none}
.tabs .btn{flex:1;min-height:24px;padding:2px 4px;font-size:11px}
.tabs .btn.sel{background:var(--k);color:var(--y)}
.tabs .btn.sel:focus{background:var(--w);color:var(--k)}
.cbar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:4px}
.cbar .btn{font-size:10px;font-family:var(--f9);padding:2px 6px;min-height:24px}
.shut{width:44px;height:44px;border-radius:50%;background:var(--w);box-shadow:0 0 0 3px var(--k),inset 0 0 0 5px var(--w),inset 0 0 0 8px var(--k);flex:none}
.shut:focus{background:var(--k);box-shadow:0 0 0 3px var(--k),inset 0 0 0 5px var(--y),inset 0 0 0 8px var(--k)}
.flash{position:absolute;inset:0;background:var(--w);animation:fl .25s steps(2) forwards;pointer-events:none}
@keyframes fl{to{opacity:0}}
.meter{height:10px;box-shadow:0 0 0 2px var(--k);background:var(--w);position:relative;margin:4px 2px}
.meter i{position:absolute;left:0;top:0;bottom:0;background:var(--k)}
.meter b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--k)}

/* 지도 */
.map{position:relative;box-shadow:0 0 0 2px var(--k);background:var(--y)}
.map canvas{display:block;width:100%}
.pin{position:absolute;width:8px;height:8px;margin:-4px 0 0 -4px;background:var(--w);box-shadow:0 0 0 2px var(--k)}
.pin.cur{width:10px;height:10px;margin:-5px 0 0 -5px;animation:blink .8s steps(1) infinite}
.pin.me{background:var(--k);box-shadow:0 0 0 2px var(--w)}
.pin.done{background:var(--k)}
.pin.cur::before{content:none}

/* 금고 */
.dials{display:flex;justify-content:center;gap:8px;margin:12px 0}
.dial{display:flex;flex-direction:column;align-items:center;gap:2px}
.dial .dv{width:52px;height:60px;display:grid;place-items:center;font-family:var(--f14);font-size:30px;background:var(--w);box-shadow:0 0 0 3px var(--k)}
.dial .dv:focus{background:var(--k);color:var(--y)}
.dial .ar{width:52px;height:20px;display:grid;place-items:center;font-size:11px}
.dial .ar:focus{background:var(--k);color:var(--y)}
.pieces{display:flex;justify-content:center;gap:6px}
.pc{width:50px;height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--k);background:var(--w);font-family:var(--f14);font-size:16px;line-height:1}
.pc small{font-size:10px;line-height:1.2}
.pc.no{background:var(--checkw);color:transparent}
.pc.no small{color:var(--k);background:var(--w);padding:0 2px}

/* 클리어 */
.clear{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:100%;text-align:center}
.frame{padding:14px 18px;box-shadow:0 0 0 2px var(--k),0 0 0 6px var(--y),0 0 0 8px var(--k);background:var(--w)}

/* 토스트 (업적) */
#toast{position:absolute;right:6px;bottom:6px;z-index:20;display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:none}
.tst{display:flex;gap:6px;align-items:center;background:var(--k);color:var(--y);padding:6px 8px;border:2px dotted var(--y);outline:2px solid var(--k);max-width:230px;animation:tin .2s steps(4)}
.tst b{display:block;font-weight:400;font-size:12px;line-height:1.3}
.tst small{display:block;color:var(--w)}
@keyframes tin{from{transform:translateY(30px);opacity:0}}

/* 하이브 */
.honey{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 0;justify-items:center;padding:4px 0 26px}
.honey > div:nth-child(3n+2){transform:translateY(26px)}
.honey .cell{width:72px;height:64px;position:relative;display:grid;place-items:center}
.honey .cell svg.hx{position:absolute;inset:0}
.honey .cell .ic{position:relative}
.honey .cap{font-family:var(--f9);font-size:10px;text-align:center;line-height:1.2;margin-top:2px}

/* 설정 */
.tog{margin-left:auto;font-family:var(--f9);font-size:10px;padding:1px 6px;box-shadow:0 0 0 2px currentColor}
.tog.on{background:currentColor}
.tog.on span{color:var(--y)}
.li:focus .tog.on span{color:var(--k)}

/* 포스터 오버레이 (기기 밖) */
#poster{position:fixed;inset:0;z-index:50;background:var(--k);display:none;overflow:auto;padding:24px 16px}
#poster.on{display:block}
.pst{width:min(420px,100%);margin:0 auto;background:var(--y);padding:22px;box-shadow:0 0 0 4px var(--w);color:var(--k);text-align:center}
.pst .ttl{font-family:var(--f14);font-size:30px;line-height:1.1;letter-spacing:.02em}
.pst .qr{background:var(--w);padding:12px;display:inline-block;margin:14px 0 8px;box-shadow:0 0 0 4px var(--k)}
.pst .qr svg{display:block;width:220px;height:220px}
.pst .code{font-family:var(--f14);font-size:20px;background:var(--k);color:var(--y);display:inline-block;padding:2px 10px}
.pst-ctl{display:flex;justify-content:center;gap:10px;margin:16px auto 0}
.pst-ctl .btn{font-size:13px}.pst-ctl .btn.k{background:var(--y);color:var(--k)}
@media print{
  body{background:#fff}
  #bg,#stage,#credit{display:none!important}
  #poster{position:static;display:block;background:none;padding:0}
  .pst-ctl{display:none}
  .pst{box-shadow:none;-webkit-print-color-adjust:exact;print-color-adjust:exact;width:100%}
}
</style>

const ICACHE={};
function icon(name,px=32){
  const key=name+px; if(ICACHE[key]) return ICACHE[key];
  const rows=(ICONS[name]||ICONS.hive).trim().split('\n');
  let d='';
  rows.forEach((r,y)=>{let x=0;while(x<r.length){if(r[x]==='#'){let s=x;while(r[x]==='#')x++;d+=`M${s} ${y}h${x-s}v1h-${x-s}z`;}else x++;}});
  return ICACHE[key]=`<svg class="ic" viewBox="0 0 16 16" width="${px}" height="${px}" aria-hidden="true"><path d="${d}"/></svg>`;
}
/* 픽셀 육각형 (세계 셀) */
function hexSVG(w,h){
  // 뾰족한 좌우, 평평한 위아래 — 4px 계단
  const P=4, rows=Math.floor(h/P); let o='',i='';
  const band=(inset)=>{let s='';for(let r=0;r<rows;r++){const yc=(r+.5)*P, t=Math.abs(yc-h/2)/(h/2); const half=w/2 - Math.round(((w*0.22)*t)/P)*P - inset; const y0=r*P; if(y0<inset||y0+P>h-inset) continue; s+=`M${w/2-half} ${y0}h${half*2}v${P}h-${half*2}z`;}return s;};
  o=band(0); i=band(4);
  return `<svg class="hx" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true"><path class="o" d="${o}"/><path class="i" d="${i}"/></svg>`;
}

let AC=null;
function tone(f=660,d=.05,vol=.035,type='square'){
  if(!S.sound) return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
    const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02);}catch(e){}
}
const jingle=(notes,step=90)=>notes.forEach((f,i)=>setTimeout(()=>tone(f,.09,.04),i*step));
const SFX={move:()=>tone(880,.025,.02),ok:()=>tone(1320,.04),back:()=>tone(440,.04),err:()=>jingle([220,180],110),
  piece:()=>jingle([784,988,1175,1568]),clear:()=>jingle([523,659,784,1047,784,1047,1319],110),shut:()=>jingle([1500,900],40)};

/* ════════════════════════════════════════════════════════════
   6. 기기 외형 (픽셀 계단 SVG)
   ════════════════════════════════════════════════════════════ */
function bandsPath(b){let d=`M${b[0].xr} ${b[0].y0}`;for(const r of b)d+=`L${r.xr} ${r.y0}L${r.xr} ${r.y1}`;for(let i=b.length-1;i>=0;i--){const r=b[i];d+=`L${r.xl} ${r.y1}L${r.xl} ${r.y0}`;}return d+'Z';}
function pxRoundRect(x,y,w,h,[tl,tr,br,bl],P=4){
  const rows=Math.floor(h/P),q=v=>Math.round(v/P)*P,ins=(R,d)=>q(R-Math.sqrt(Math.max(0,R*R-d*d)));const b=[];
  for(let i=0;i<rows;i++){const yc=(i+.5)*P,db=rows*P-yc;let l=0,r=0;
    if(yc<tl)l=ins(tl,tl-yc);if(yc<tr)r=ins(tr,tr-yc);if(db<bl)l=ins(bl,bl-db);if(db<br)r=ins(br,br-db);
    b.push({y0:y+i*P,y1:y+(i+1)*P,xl:x+l,xr:x+w-r});}

function navMove(dir){

  const body=$('.body',scr);
  if(!items.includes(a)){items[0]&&items[0].focus();return;}
  const r=a.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let best=null,bs=1e9;
  for(const el of items){if(el===a)continue;const q=el.getBoundingClientRect(),x=q.left+q.width/2,y=q.top+q.height/2,dx=x-cx,dy=y-cy;

    if(m<=2)continue;const s=m+c*(dir==='up'||dir==='down'?1.6:3);if(s<bs){bs=s;best=el;}}

/* 카메라 미션 판정 (원본 프레임 기준) */
function analyze(img){
  const d=img.data,N=d.length/4;let sum=0,warm=0,bright=0,white=0,hot=0;
  for(let i=0;i<d.length;i+=4){const r=d[i],g=d[i+1],b=d[i+2],l=.299*r+.587*g+.114*b,mx=Math.max(r,g,b),mn=Math.min(r,g,b);sum+=l;
    if(r>140&&g>70&&r-b>55)warm++;if(l>165)bright++;if(l>180&&mx-mn<45)white++;if(l>205)hot++;}
  return{avg:sum/N/255,warm:warm/N,bright:bright/N,white:white/N,hot:hot/N};
}
function judge(W,a){const c=W.cam;switch(c.test){
  case'warm':return{ok:a.warm>=c.goal,v:a.warm,label:'따뜻한 빛',goal:c.goal};
  case'bright':return{ok:a.bright>=c.goal,v:a.bright,label:'밝은 영역',goal:c.goal};
  case'dark':return{ok:a.avg<=c.goal,v:a.avg,label:'평균 밝기',goal:c.goal,inv:true};
  case'white':return{ok:a.white>=c.goal,v:a.white,label:'하얀 영역',goal:c.goal};
  case'moon':return{ok:a.hot>=.003&&a.hot<=.2&&a.avg<.42,v:a.hot,label:'둥근 빛',goal:.003,extra:a.avg<.42?'':' · 주변이 너무 밝아요'};
}}

function dist(a,b,c,d){const R=6371e3,t=x=>x*Math.PI/180,dl=t(c-a),dn=t(d-b),h=Math.sin(dl/2)**2+Math.cos(t(a))*Math.cos(t(c))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
const fmtD=m=>m<1000?Math.round(m)+'m':Math.round(m/1000).toLocaleString()+'km';

  navigator.geolocation.getCurrentPosition(p=>{ME={lat:p.coords.latitude,lon:p.coords.longitude};res(ME)},e=>rej(new Error(e.code===1?'위치 권한이 거부됐어요':'위치를 찾지 못했어요')),{enableHighAccuracy:true,timeout:12000,maximumAge:30000});});}

const BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5].map(v=>(v+.5)/16);
const PAL={k:[0,0,0],y:[245,255,0],w:[255,255,255]};
const Cam={tok:0,stream:null,video:null,still:null,facing:'environment',on:false,raf:0,last:0,lastQR:0,cols:64,tone:3,frame:false,mode:'pixel',err:''};
async function camOpen(){
  Cam.err='';
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){Cam.err='여기서는 실시간 카메라를 열 수 없어요.\n사진을 찍거나 골라도 똑같이 픽셀로 바뀌고, 미션·QR도 판정돼요.';return null;}
  try{return await navigator.mediaDevices.getUserMedia({video:{facingMode:Cam.facing,width:{ideal:640},height:{ideal:480}},audio:false});}
  catch(e){Cam.err='여기서는 실시간 카메라를 열 수 없어요.\n사진을 찍거나 골라도 똑같이 픽셀로 바뀌고, 미션·QR도 판정돼요.';return null;}
}
function camStop(){Cam.tok++;Cam.on=false;cancelAnimationFrame(Cam.raf);if(Cam.stream){Cam.stream.getTracks().forEach(t=>t.stop());Cam.stream=null;}Cam.video=null;$('#isl').classList.remove('rec');}
const srcOf=()=>Cam.still||(Cam.video&&Cam.video.readyState>=2?Cam.video:null);
function drawCover(src,g,W,H,mirror){const sw=src.videoWidth||src.naturalWidth||src.width,sh=src.videoHeight||src.naturalHeight||src.height;if(!sw)return;
  const s=Math.max(W/sw,H/sh),dw=sw*s,dh=sh*s;g.save();if(mirror){g.translate(W,0);g.scale(-1,1);}g.imageSmoothingEnabled=true;g.drawImage(src,(W-dw)/2,(H-dh)/2,dw,dh);g.restore();}
function ditherTo(img,tone){
  const d=img.data,W=img.width,N=W*img.height,L=new Float32Array(N);let lo=255,hi=0;
  for(let i=0;i<N;i++){const l=.299*d[i*4]+.587*d[i*4+1]+.114*d[i*4+2];L[i]=l;}
  const sorted=Float32Array.from(L).sort();lo=sorted[Math.floor(N*.03)];hi=sorted[Math.floor(N*.97)];if(hi-lo<40){const m=(hi+lo)/2;lo=m-20;hi=m+20;}
  for(let i=0;i<N;i++){const x=i%W,y=(i/W)|0,t=BAYER[(y&3)*4+(x&3)];let v=(L[i]-lo)/(hi-lo);v=v<0?0:v>1?1:v;let c;
    if(tone===3){const s=v*2,b=Math.floor(s),f=s-b,lv=Math.min(2,b+(f>t?1:0));c=lv===0?PAL.k:lv===1?PAL.y:PAL.w;}
    else c=v>t?PAL.y:PAL.k;
    d[i*4]=c[0];d[i*4+1]=c[1];d[i*4+2]=c[2];d[i*4+3]=255;}
  return img;
}
function addFrame(g,W,H){g.fillStyle=K;g.fillRect(0,0,W,2);g.fillRect(0,0,2,H);g.fillRect(W-2,0,2,H);g.fillRect(0,H-9,W,9);const p=P(g);const t=W>=60?'FILL THE HIVE':'HIVE';p.text(t,Math.floor((W-t.length*4+1)/2),H-7,Y);}

  return{cls:'web',title:'웹',right:`<button class="rt pk" data-f data-act="url:hive.os">★</button>`,html:`<div class="addr" data-submit="go"><input id="url" data-f value="${esc(normURL(url)||'hive.os')}" spellcheck="false" autocapitalize="off" autocomplete="off" enterkeyhint="go"><button class="btn k" data-f data-act="go">GO</button></div><div class="body web">${body}</div>`,

function seqPush(scr,k){const W=WORLDS[scr.sid],want=W.secret.seq,v=$('#seqv');scr.seq.push(k);const ar={up:'↑',down:'↓',left:'←',right:'→'};

SCREENS.cam=({mode})=>{Cam.mode=mode||Cam.mode||'pixel';const id=S.world,W=id?WORLDS[id]:null;
  const tab=(m,l)=>`<button class="btn ${Cam.mode===m?'sel':''}" data-f data-act="cammode:${m}">${l}</button>`;
  return{cls:'cam',title:Cam.mode==='qr'?'꽃 스캔':'카메라',right:`<button class="rt pk" data-f data-act="flipcam">⟲</button>`,
   html:`<div class="body"><div class="tabs">${tab('pixel','픽셀')}${W?tab('mission','미션'):''}${tab('qr','꽃 QR')}</div>
    <div class="vf" id="vf"><canvas id="cv"></canvas>${Cam.mode==='qr'?'<div class="ret"></div>':''}
      ${Cam.mode==='mission'&&W?`<div class="mi">${icon(W.icon,12).replace('class="ic"','class="ic" style="display:inline;vertical-align:-2px"')} ${W.cam.title} — ${W.cam.desc}</div>`:''}
      ${Cam.mode==='qr'?'<div class="mi">꽃 포스터의 QR을 네모 안에 맞춰 주세요</div>':''}<div class="msg" id="cmsg">카메라 여는 중…</div></div>
    ${Cam.mode==='qr'?`<div class="addr" data-submit="qrcode" style="padding:0;border:0;background:none"><input id="qri" data-f placeholder="QR 아래 코드 (예: BTS-0613)" autocapitalize="characters" autocomplete="off"><button class="btn k" data-f data-act="qrcode">입력</button></div>`:''}
    <div class="cbar"><button class="btn" data-f data-act="upload">사진</button>
      ${Cam.mode!=='qr'?`<button class="btn" data-f data-act="camtone">${Cam.tone===3?'3톤':'2톤'}</button>`:''}
      ${Cam.mode!=='qr'?`<button class="shut" data-f data-autof data-act="shutter" aria-label="셔터"></button>`:'<span class="sp"></span>'}
      ${Cam.mode==='pixel'?`<button class="btn" data-f data-act="camres">${Cam.cols}px</button><button class="btn ${Cam.frame?'k':''}" data-f data-act="camframe">프레임</button>`:''}
      ${Cam.mode==='mission'&&S.demo?`<button class="btn" data-f data-act="force:cam">데모 통과</button>`:''}</div></div>`,
   async mount(el){const vf=$('#vf',el),cv=$('#cv',el),msg=$('#cmsg',el);
     const r=vf.getBoundingClientRect();const cols=Cam.mode==='qr'?72:Cam.cols;const rows=Math.max(24,Math.round(cols*r.height/r.width));cv.width=cols;cv.height=rows;
     const g=cv.getContext('2d',{willReadFrequently:true});const work=document.createElement('canvas');work.width=cols;work.height=rows;const wg=work.getContext('2d',{willReadFrequently:true});
     const qc=document.createElement('canvas');const qg=qc.getContext('2d',{willReadFrequently:true});
     this.cv=cv;this.work=work;this.wg=wg;
     const tok=++Cam.tok;let ok=!!Cam.still;
     if(!Cam.still){const st=await camOpen();if(tok!==Cam.tok){st&&st.getTracks().forEach(x=>x.stop());return;}
       if(st){Cam.stream=st;Cam.video=document.createElement('video');Cam.video.playsInline=true;Cam.video.muted=true;Cam.video.setAttribute('playsinline','');Cam.video.srcObject=st;try{await Cam.video.play();}catch(e){}$('#isl').classList.add('rec');ok=true;}}
     if(!ok){msg.innerHTML=`<div><p class="pre">${esc(Cam.err)}</p><button class="btn k mt" data-f data-act="upload" style="background:var(--y);color:var(--k)">${icon('camera',16)} 사진 찍기 · 불러오기</button></div>`;const b=$('button',msg);b&&b.focus();}else msg.remove();
     if(Cam.still&&Cam.mode==='mission'&&Cam.auto){Cam.auto=false;setTimeout(shutter,400);}
     Cam.on=true;const loop=t=>{if(!Cam.on)return;Cam.raf=requestAnimationFrame(loop);if(t-Cam.last<50)return;Cam.last=t;const src=srcOf();if(!src)return;
       const m=Cam.facing==='user'&&!Cam.still;drawCover(src,wg,cols,rows,m);const img=wg.getImageData(0,0,cols,rows);g.putImageData(ditherTo(img,Cam.mode==='qr'?2:Cam.tone),0,0);
       if(Cam.mode==='qr'&&window.jsQR&&t-Cam.lastQR>280){Cam.lastQR=t;const sw=src.videoWidth||src.naturalWidth||src.width,sh=src.videoHeight||src.naturalHeight||src.height;const sc=Math.min(1,480/Math.max(sw,sh));qc.width=Math.round(sw*sc);qc.height=Math.round(sh*sc);qg.drawImage(src,0,0,qc.width,qc.height);
         const res=jsQR(qg.getImageData(0,0,qc.width,qc.height).data,qc.width,qc.height,{inversionAttempts:'attemptBoth'});if(res&&res.data)onQR(res.data);}};
     Cam.raf=requestAnimationFrame(loop);},
   unmount(){camStop();}};};
let lastQRtxt='',lastQRt=0;
function onQR(txt){const now=Date.now();if(txt===lastQRtxt&&now-lastQRt<4000)return;lastQRtxt=txt;lastQRt=now;
  const id=parseFlower(txt);if(id){flowerFound(id);}else{SFX.err();toast('꽃이 아닌 QR',esc(txt).slice(0,40),'qr');}}
function shutter(){
  const c=cur;if(!c||!c.cv)return;const src=srcOf();if(!src){toast('카메라가 없어요','[불러오기]로 사진을 골라요','camera');return;}
  SFX.shut();const vf=$('#vf');vf.insertAdjacentHTML('beforeend','<div class="flash"></div>');setTimeout(()=>{const f=$('.flash',vf);f&&f.remove()},300);
  if(Cam.mode==='mission'){const W=WORLDS[S.world];const tmp=document.createElement('canvas');tmp.width=64;tmp.height=48;const tg=tmp.getContext('2d',{willReadFrequently:true});drawCover(src,tg,64,48,false);
    const a=analyze(tg.getImageData(0,0,64,48)),j=judge(W,a);showMeter(j);if(j.ok){setTimeout(()=>award(S.world,'cam'),500);}else SFX.err();savePhoto();return;}

function savePhoto(quiet){const c=cur;const out=document.createElement('canvas');out.width=c.cv.width;out.height=c.cv.height;const g=out.getContext('2d');g.drawImage(c.cv,0,0);if(Cam.frame&&Cam.mode==='pixel')addFrame(g,out.width,out.height);
  S.photos.push(out.toDataURL('image/png'));if(S.photos.length>24)S.photos.shift();save();if(!quiet)return;toast('픽셀 사진 저장','앨범에서 볼 수 있어요','album',1800);}

  $('#vf').appendChild(box);setTimeout(()=>box.remove(),3200);}

   mount(el){const c=$('#mapc',el),g=c.getContext('2d');g.fillStyle=Y;g.fillRect(0,0,MAP_W,MAP_H);

  <div class="li" style="cursor:default">${icon('bee',18)}<span class="sp"><span class="sub">FILL THE HIVE · HIVE OS v0.1<br>하이브 브랜드 캠페인 학생 콘셉트 프로토타입 (비공식). 아티스트·레이블과 관계없는 가상의 게임이에요.</span></span></div></div>`};};
SCREENS.kit=()=>({title:'QR 포스터 키트',html:`<div class="body" style="padding:0 6px"><p style="padding:6px 0"><small>각 세계의 꽃 포스터예요. 인쇄해서 붙이거나, 다른 화면에 띄워 스캔해 보세요.</small></p>
  ${ORDER.map(id=>`<button class="li" data-f data-act="poster:${id}">${icon(WORLDS[id].icon,20)}<span class="sp">${WORLDS[id].place}<span class="sub">QR ${qrHuman(id)} · 체크인 ${WORLDS[id].gcode}</span></span>${WS(id).p.qr?icon('check',16):''}</button>`).join('')}</div>`});

/* ════════════════════════════════════════════════════════════
   12. 액션
   ════════════════════════════════════════════════════════════ */
function act(a,el){
  const i=a.indexOf(':'),k=i<0?a:a.slice(0,i),v=i<0?'':a.slice(i+1);
  switch(k){
    case'back':SFX.back();back();break;
    case'home':SFX.back();goHome();break;
    case'bootgo':SFX.ok();stack=[];go(S.intro?(S.world?'home':'select'):'intro',{i:0});break;
    case'intronext':{SFX.ok();const n=+v+1;if(n<INTRO.length)go('intro',{i:n},true);else{S.intro=true;save();stack=[];go('select');}break;}
    case'world':SFX.ok();go('worldcard',{id:v});break;
    case'locked':SFX.err();toast(v,'SEASON 2에 꽃이 피어나요','lock');break;
    case'enter':S.world=v;save();SFX.ok();stack=[];go('home');setTimeout(()=>toast('새 메시지','QUEEN: 새 전달자님, 환영해요','bee'),500);break;
    case'select':SFX.ok();S.world=null;save();stack=[];go('select');break;
    case'open':SFX.ok();
      if(v==='world'){act('select');break;}
      if(v==='qr'){go('cam',{mode:'qr'});break;}
      if(v==='cam'){go('cam',{mode:Cam.mode==='qr'?'pixel':Cam.mode});break;}
      go(v);break;
    case'thread':SFX.ok();go('thread',{id:v});break;
    case'hint':SFX.ok();go('thread',{id:'queen',hint:true},true);break;
    case'note':SFX.ok();go('note',{i:+v});break;
    case'photo':SFX.ok();go('photo',{k:v});break;
    case'flip':SFX.ok();cur.flip&&cur.flip();break;
    case'url':SFX.ok();go('web',{url:v},stack[stack.length-1].name==='web');break;
    case'go':{const u=$('#url');SFX.ok();if(u){u.blur();go('web',{url:u.value},true);}break;}
    case'seq':if(cur.seq)seqPush(cur,v);break;
    case'kp':{if(cur.kp===undefined)break;const d=$('#kpd'),W=WORLDS[cur.kid];
      if(v==='del')cur.kp=cur.kp.slice(0,-1);else if(v==='ok'){if(cur.kp===W.secret.keypad){d.textContent='OPEN';tone(1500,.1);setTimeout(()=>{$('.body.web').innerHTML=`<div class="clear" style="min-height:auto;padding:16px 0"><div class="frame">${icon(W.icon,48)}</div><p class="pre t14">${W.secretHtml}</p><div class="pk" style="padding:6px 12px">꽃가루 조각 [${W.word[0]}]</div></div>`;award(cur.kid,'web');},400);return;}
        SFX.err();d.textContent=W.bad;d.classList.add('shake');cur.kp='';setTimeout(()=>{d.classList.remove('shake');d.textContent='_ _ _';},1100);return;}
      else if(cur.kp.length<3)cur.kp+=v;tone(900,.03);d.textContent=(cur.kp+'___').slice(0,3).split('').join(' ');break;}
    case'cammode':SFX.ok();go('cam',{mode:v},true);break;
    case'flipcam':SFX.ok();Cam.facing=Cam.facing==='user'?'environment':'user';Cam.still=null;go('cam',{mode:Cam.mode},true);break;
    case'camtone':SFX.ok();Cam.tone=Cam.tone===3?2:3;el.textContent=Cam.tone===3?'3톤':'2톤';break;
    case'camres':{SFX.ok();const o=[48,64,96];Cam.cols=o[(o.indexOf(Cam.cols)+1)%o.length];go('cam',{mode:Cam.mode},true);break;}
    case'camframe':SFX.ok();Cam.frame=!Cam.frame;el.classList.toggle('k',Cam.frame);break;
    case'shutter':shutter();break;
    case'upload':$('#filein').click();break;
    case'qrcode':{const inp=$('#qri');const id=parseFlower(inp&&inp.value);if(id){inp.value='';inp.blur();flowerFound(id);}else{SFX.err();toast('맞지 않는 코드','예) BTS-0613 형식','qr');}break;}
    case'force':SFX.ok();award(S.world,v);break;
    case'checkin':SFX.ok();checkin();break;
    case'geocode':{const inp=$('#geoi');const v2=String(inp&&inp.value||'').toUpperCase().replace(/\s/g,'');const id=ORDER.find(i=>WORLDS[i].gcode.replace('-','')===v2.replace('-',''));if(id){inp.value='';inp.blur();award(id,'geo');}else{SFX.err();toast('맞지 않는 코드','현장 스태프에게 받은 코드를 확인해요','pin');}break;}
    case'dial':{const [d,s]=v.split(':');turnDial(+d,+s);break;}
    case'unlock':unlock();break;
    case'dl':downloadPhoto(+v);break;
    case'del':S.photos.splice(+v,1);save();SFX.back();back();break;
    case'sound':S.sound=!S.sound;save();SFX.ok();go('settings',{},true);break;
    case'demo':S.demo=!S.demo;save();SFX.ok();go('settings',{},true);toast('데모 모드 '+(S.demo?'ON':'OFF'),S.demo?'지도·카메라에 우회 버튼이 생겨요':'','gear');break;
    case'plant':SFX.ok();locate().then(p=>{S.flower=p;save();toast('꽃을 심었어요','반경 300m 안에서 체크인 가능','pin');go('settings',{},true);}).catch(e=>toast('위치 실패',e.message,'pin'));break;
    case'reset':{const s=$('#rsub');if(s&&s.dataset.arm){try{localStorage.removeItem(KEY)}catch(_){}S={sound:S.sound,demo:false,intro:false,world:null,w:{},photos:[],flower:null};save();stack=[];go('boot');toast('초기화 완료','처음부터 시작해요','bee');}else if(s){s.dataset.arm='1';s.textContent='한 번 더 누르면 초기화돼요';SFX.err();}break;}
    case'poster':SFX.ok();openPoster(v);break;
    case'selfie':SFX.ok();Cam.facing='user';Cam.frame=true;Cam.still=null;go('cam',{mode:'pixel'});break;
  }
}
$('#filein').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const img=new Image();img.onload=()=>{Cam.still=img;Cam.auto=true;e.target.value='';if(stack[stack.length-1].name==='cam'){camStop();go('cam',{mode:Cam.mode},true);}};img.src=URL.createObjectURL(f);});
function downloadPhoto(i){const src=S.photos[i];const im=new Image();im.onload=()=>{const s=8,c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;const g=c.getContext('2d');g.imageSmoothingEnabled=false;g.drawImage(im,0,0,c.width,c.height);
  saveCanvas(c,`hive_pixel_${String(i+1).padStart(2,'0')}.png`,'8배 크기 PNG');};im.src=src;}
async function saveCanvas(c,name,sub){
  const blob=await new Promise(r=>c.toBlob(r,'image/png'));
  if(window.claude&&window.claude.use){let dl=null;try{dl=await window.claude.use('downloads');}catch(e){}
    if(dl){try{await dl.save({filename:name,data:blob});toast('저장했어요',sub,'album');}catch(e){if(!e||e.code!=='declined')toast('저장할 수 없어요','이 화면에서는 저장이 막혀 있어요','album');}return;}
    toast('저장할 수 없어요','이 화면에서는 저장이 막혀 있어요','album');return;}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();toast('저장했어요',sub,'album');}

/* QR 포스터 (기기 밖 전체 화면 · 인쇄 가능) */
function qrSVG(text){if(!window.qrcode)return'<p>QR 라이브러리를 불러오는 중…</p>';const q=qrcode(0,'M');q.addData(text);q.make();const n=q.getModuleCount();let d='';
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+=`M${c} ${r}h1v1h-1z`;return`<svg viewBox="-1 -1 ${n+2} ${n+2}" aria-label="QR"><path d="${d}" fill="${K}"/></svg>`;}
function openPoster(id){const W=WORLDS[id];const p=$('#poster');p.innerHTML=`<div class="pst"><small>FILL THE HIVE · ${W.tag}</small><div class="ttl mt">FIND<br>THE FLOWER</div>
  <div style="display:flex;justify-content:center;margin-top:14px;color:var(--k)">${icon(W.icon,64)}</div><div class="t14 mt">${W.place}</div><small>${W.en}</small><br>
  <div class="qr">${qrSVG(qrText(id))}</div><br><span class="code">${qrHuman(id)}</span><p class="mt"><small>HIVE OS ▸ 꽃 스캔으로 QR을 비추세요.<br>스캔이 안 되면 위 코드를 직접 입력해요.</small></p></div>
  <div class="pst-ctl"><button class="btn k" onclick="posterPNG('${id}')">PNG 저장</button>${window.claude?'':'<button class="btn k" onclick="window.print()">인쇄</button>'}<button class="btn" onclick="closePoster()">닫기 (Esc)</button></div>`;p.classList.add('on');}
function posterPNG(id){const W=WORLDS[id];const c=document.createElement('canvas');c.width=600;c.height=860;const g=c.getContext('2d');g.fillStyle=Y;g.fillRect(0,0,600,860);g.fillStyle=K;g.fillRect(0,0,600,12);g.fillRect(0,848,600,12);g.fillRect(0,0,12,860);g.fillRect(588,0,12,860);
  g.textAlign='center';g.font='20px Galmuri11, monospace';g.fillText('FILL THE HIVE · '+W.tag,300,64);g.font='56px Galmuri14, monospace';g.fillText('FIND',300,136);g.fillText('THE FLOWER',300,196);
  const rows=ICONS[W.icon].trim().split('\n');rows.forEach((r,y)=>{for(let x=0;x<16;x++)if(r[x]==='#')g.fillRect(268+x*4,222+y*4,4,4);});
  g.font='28px Galmuri14, monospace';g.fillText(W.place,300,324);g.font='16px Galmuri9, monospace';g.fillText(W.en,300,350);
  if(window.qrcode){const q=qrcode(0,'M');q.addData(qrText(id));q.make();const n=q.getModuleCount(),sz=300,cs=Math.floor(sz/(n+2)),ox=300-cs*(n+2)/2,oy=376;g.fillRect(ox-8,oy-8,cs*(n+2)+16,cs*(n+2)+16);g.fillStyle=WH;g.fillRect(ox,oy,cs*(n+2),cs*(n+2));g.fillStyle=K;for(let r=0;r<n;r++)for(let cc=0;cc<n;cc++)if(q.isDark(r,cc))g.fillRect(ox+(cc+1)*cs,oy+(r+1)*cs,cs,cs);}
  g.fillRect(190,712,220,44);g.fillStyle=Y;g.font='28px Galmuri14, monospace';g.fillText(qrHuman(id),300,744);g.fillStyle=K;g.font='18px Galmuri11, monospace';g.fillText('HIVE OS ▸ 꽃 스캔으로 QR을 비추세요',300,796);g.font='14px Galmuri9, monospace';g.fillText('하이브 캠페인 학생 콘셉트 (비공식)',300,826);
  saveCanvas(c,`flower_poster_${id}.png`,'꽃 포스터 PNG');}
function closePoster(){$('#poster').classList.remove('on');}

/* ════════════════════════════════════════════════════════════
   13. 시작
   ════════════════════════════════════════════════════════════ */
function layout(){const c=$('#controls'),r=c.getBoundingClientRect();c.style.setProperty('--cs',Math.min(1,r.width/410,r.height/246).toFixed(3));drawShell();drawBG();}
drawControls();
addEventListener('resize',()=>{clearTimeout(layout.t);layout.t=setTimeout(layout,80);});
requestAnimationFrame(()=>{layout();go('boot');});
document.fonts&&document.fonts.ready.then(()=>{layout();});
</script>
