const BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5].map(v=>(v+.5)/16);const PAL={k:[0,0,0],y:[245,255,0],w:[255,255,255]};
function dither(img){const d=img.data,W=img.width,N=W*img.height,L=new Float32Array(N);for(let i=0;i<N;i++)L[i]=.299*d[i*4]+.587*d[i*4+1]+.114*d[i*4+2];
 const s=Float32Array.from(L).sort();let lo=s[Math.floor(N*.03)],hi=s[Math.floor(N*.97)];if(hi-lo<40){const m=(hi+lo)/2;lo=m-20;hi=m+20;}
 for(let i=0;i<N;i++){const x=i%W,y=(i/W)|0,t=BAYER[(y&3)*4+(x&3)];let v=(L[i]-lo)/(hi-lo);v=v<0?0:v>1?1:v;const b=Math.floor(v*2),f=v*2-b,lv=Math.min(2,b+(f>t?1:0));const c=lv===0?PAL.k:lv===1?PAL.y:PAL.w;d[i*4]=c[0];d[i*4+1]=c[1];d[i*4+2]=c[2];d[i*4+3]=255;}return img;}
function cover(src,g,W,H,mirror){const sw=src.videoWidth||src.naturalWidth||src.width,sh=src.videoHeight||src.naturalHeight||src.height;if(!sw)return false;const s=Math.max(W/sw,H/sh),dw=sw*s,dh=sh*s;g.save();if(mirror){g.translate(W,0);g.scale(-1,1);}g.drawImage(src,(W-dw)/2,(H-dh)/2,dw,dh);g.restore();return true;}

  try{if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw 0;stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:480},height:{ideal:640}},audio:false});video=document.createElement('video');video.playsInline=true;video.muted=true;video.srcObject=stream;await video.play();$('#isl').classList.add('rec');frame();}
  catch(e){fallback();toast('카메라를 열 수 없어요','사진을 고르거나, 카메라 없이 계속할 수 있어요','camera');}
